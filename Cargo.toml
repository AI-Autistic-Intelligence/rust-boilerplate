[package]
name = "rust-boilerplate"
version = "0.1.0"
edition = "2021"
description = "A standard boilerplate utilizing rust-yalc"

[dependencies]
# Yalc Core Crates (Lego Pieces)
yalc-app = { path = "libs/rust-yalc/crates/yalc-app" }
yalc-errors = { path = "libs/rust-yalc/crates/yalc-errors" }
yalc-logger = { path = "libs/rust-yalc/crates/yalc-logger" }
yalc-metrics = { path = "libs/rust-yalc/crates/yalc-metrics" }

# Database Lego Pieces (Mix and Match!)
yalc-database-core = { path = "libs/rust-yalc/crates/database/yalc-database-core" }
yalc-database-seaorm = { path = "libs/rust-yalc/crates/database/yalc-database-seaorm" }
yalc-database-mongo = { path = "libs/rust-yalc/crates/database/yalc-database-mongo" }
yalc-database-redis = { path = "libs/rust-yalc/crates/database/yalc-database-redis" }

# AG-Grid Translators
yalc-ag-grid-core = { path = "libs/rust-yalc/crates/ag-grid/yalc-ag-grid-core" }
yalc-ag-grid-seaorm = { path = "libs/rust-yalc/crates/ag-grid/yalc-ag-grid-seaorm" }

# Application specific dependencies
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
dotenvy = "0.15"
