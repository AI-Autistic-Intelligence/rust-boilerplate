[package]
name = "boilerplate-simple"
version = "0.1.0"
edition = "2021"
description = "A standard boilerplate utilizing ferrox"

[dependencies]
# Ferrox Core Crates (Lego Pieces)
ferrox-app = { path = "../libs/rust-yalc/crates/ferrox-app" }
ferrox-errors = { path = "../libs/rust-yalc/crates/ferrox-errors" }
ferrox-logger = { path = "../libs/rust-yalc/crates/ferrox-logger" }
ferrox-metrics = { path = "../libs/rust-yalc/crates/ferrox-metrics" }
ferrox-transports = { path = "../libs/rust-yalc/crates/ferrox-transports", features = ["http"] }

# Integrations
ferrox-jobs = { path = "../libs/rust-yalc/crates/ferrox-jobs" }
ferrox-rate-limiter = { path = "../libs/rust-yalc/crates/ferrox-rate-limiter" }

# Application specific dependencies
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
dotenvy = "0.15"
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }
